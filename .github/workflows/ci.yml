# Generated with Claude Code - CS 3660 Sprint 3
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - name: Backend tests
        run: npm run test:backend
        env:
          DATABASE_PATH: ':memory:'
          JWT_PRIVATE_KEY: ${{ secrets.TEST_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.TEST_JWT_PUBLIC_KEY }}
          JWT_KID: 'test-key'
      - name: Frontend tests
        run: npm run test:frontend

  build:
    name: Build and verify cache busting
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - name: Assert service worker carries this commit
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          grep -q "v-$SHORT_SHA" frontend/dist/sw.js \
            || { echo "sw.js is missing cache version v-$SHORT_SHA"; exit 1; }
          echo "Cache version v-$SHORT_SHA present in sw.js"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-frontend:
    name: Deploy frontend to Netlify
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.netlify.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Deploy
        id: netlify
        run: npx netlify-cli@17 deploy --dir=dist --prod --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.BACKEND_URL }}/health" > /dev/null; then
              echo "Backend healthy"; exit 0
            fi
            echo "Attempt $i, waiting"; sleep 10
          done
          echo "Backend did not become healthy"; exit 1
